<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus Lens — Dataverse Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2em; background: #fafbff; color: #222; }
    h1 { color: #2c3e8f; }
    #graph-container {
      width: 100%;
      height: 500px;
      border: 1px solid #e0e6ff;
      margin: 1.5em 0;
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    #input-section input {
      padding: 8px 12px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
    }
    button {
      padding: 8px 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #2980b9; }
    #co-create {
      margin-top: 2em;
      padding: 1.2em;
      background: #f0f7ff;
      border-left: 4px solid #3498db;
      border-radius: 0 6px 6px 0;
    }
  </style>
</head>
<body>
  <h1>Nexus Lens</h1>
  <p>Explore the Dataverse — a living knowledge ecosystem inspired by the vision of collaborative AI.</p>
  
  <div id="input-section">
    <input type="text" id="seed" placeholder="e.g., mycelial networks, justice, sonata form" />
    <button onclick="explore()">Explore Universe</button>
  </div>

  <div id="graph-container">
    <p>Visualization engine (D3.js / Three.js) will render connected concepts here.</p>
  </div>

  <div id="co-create">
    <h3>🌱 Add Your Insight</h3>
    <textarea id="note" rows="3" placeholder="Suggest a new link, share local knowledge, or flag a gap..."></textarea><br/>
    <button onclick="submitContribution()" style="margin-top: 8px;">Contribute to the Dataverse</button>
  </div>

  <script src="nexus.js"></script>
</body>
</html>
